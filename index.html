<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Management — Oefenapp</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d10;--s1:#141418;--s2:#1c1c24;--s3:#24242e;
  --border:#2c2c3a;--border2:#3c3c50;
  --acc:#7c6ef5;--acc2:#00c9a7;--acc3:#ff6b6b;--acc4:#ffc94d;
  --text:#e6e6f0;--t2:#8888aa;--t3:#4a4a68;
  --mono:'IBM Plex Mono',monospace;--sans:'Syne',sans-serif;
  --r:10px;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;flex-direction:column}

/* ── HEADER ── */
.header{
  padding:14px 20px;border-bottom:1px solid var(--border);
  background:var(--s1);display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.logo{font-size:1.1rem;font-weight:800;letter-spacing:-.02em}
.logo span{color:var(--acc)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fb{
  font-family:var(--mono);font-size:0.68rem;padding:5px 13px;
  border-radius:99px;border:1px solid var(--border);color:var(--t2);
  background:transparent;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.fb:hover{border-color:var(--acc);color:var(--text)}
.fb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.progress-wrap{width:180px}
.pbar-label{font-family:var(--mono);font-size:0.65rem;color:var(--t2);display:flex;justify-content:space-between;margin-bottom:4px}
.pbar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}

/* ── MAIN ── */
.main{max-width:780px;margin:0 auto;padding:24px 20px;width:100%}

/* ── QUESTION CARD ── */
.qcard{
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:18px;overflow:hidden;transition:box-shadow .2s;
}
.qcard:hover{box-shadow:0 6px 28px rgba(124,110,245,.07)}

.qcard-head{
  display:flex;align-items:flex-start;gap:12px;
  padding:14px 16px 10px;border-bottom:1px solid var(--border);
}
.qnum{
  font-family:var(--mono);font-size:0.7rem;font-weight:600;
  color:var(--acc);min-width:28px;padding-top:2px;
}
.qtags{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto;padding-top:2px}
.qtag{
  font-family:var(--mono);font-size:0.6rem;padding:2px 8px;
  border-radius:99px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
}
.tag-stelling{background:rgba(124,110,245,.15);color:var(--acc)}
.tag-theorie{background:rgba(255,201,77,.13);color:var(--acc4)}
.tag-sql{background:rgba(0,201,167,.13);color:var(--acc2)}
.tag-ddl{background:rgba(74,222,128,.12);color:#4ade80}
.tag-procedure{background:rgba(255,107,107,.13);color:var(--acc3)}
.tag-transactie{background:rgba(255,107,107,.1);color:#fca5a5}
.tag-window{background:rgba(124,110,245,.18);color:#a89cf7}
.tag-performantie{background:rgba(255,201,77,.1);color:#fde68a}
.tag-security{background:rgba(74,222,128,.1);color:#86efac}

.qsource{font-family:var(--mono);font-size:0.6rem;color:var(--t3)}

.qbody{padding:14px 16px 10px}
.qtext{font-size:.93rem;line-height:1.7}
.qtext code,.hint-body code,.answer-text code{
  font-family:var(--mono);background:var(--s3);
  padding:.1em .4em;border-radius:4px;font-size:.83em;color:var(--acc2);
}
.qtext pre,.answer-text pre{
  font-family:var(--mono);background:var(--s2);border:1px solid var(--border);
  border-radius:6px;padding:12px 14px;font-size:.78rem;overflow-x:auto;
  margin:10px 0;line-height:1.55;color:#ccd0fa;
}
.kw{color:var(--acc)}.fn{color:var(--acc2)}.str{color:#a3e635}.cm{color:var(--t3)}.num{color:var(--acc4)}

/* hint: thinking prompt shown before answer */
.hint-box{
  margin:8px 0 2px;padding:10px 13px;
  background:rgba(255,201,77,.05);
  border-left:3px solid var(--acc4);border-radius:0 6px 6px 0;
  font-size:.83rem;color:#e0d5a0;font-style:italic;line-height:1.6;
}
.hint-body{font-size:.83rem;line-height:1.6}

.qactions{
  padding:10px 16px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.btn-show{
  background:var(--acc);color:#fff;border:none;
  padding:7px 16px;border-radius:6px;font-family:var(--mono);font-size:.75rem;
  cursor:pointer;font-weight:600;transition:opacity .15s;
}
.btn-show:hover{opacity:.88}
.btn-mark{
  background:transparent;border:1px solid var(--border);color:var(--t2);
  padding:6px 13px;border-radius:6px;font-family:var(--mono);font-size:.72rem;
  cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;
}
.btn-mark:hover.ok{border-color:#4ade80;color:#4ade80;background:rgba(74,222,128,.07)}
.btn-mark:hover.err{border-color:var(--acc3);color:var(--acc3);background:rgba(255,107,107,.07)}
.btn-mark.selected-ok{border-color:#4ade80;color:#4ade80;background:rgba(74,222,128,.1)}
.btn-mark.selected-err{border-color:var(--acc3);color:var(--acc3);background:rgba(255,107,107,.1)}

.answer-block{
  display:none;border-top:1px solid var(--border);
  padding:14px 16px;background:rgba(124,110,245,.03);
  animation:fadeIn .2s ease;
}
.answer-block.open{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.alabel{font-family:var(--mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);margin-bottom:8px}
.answer-text{font-size:.88rem;line-height:1.7}
.tip-strip{
  margin-top:10px;padding:8px 12px;
  background:rgba(0,201,167,.06);border-left:3px solid var(--acc2);
  border-radius:0 6px 6px 0;font-size:.8rem;color:var(--t2);
}

.empty{text-align:center;padding:3rem;color:var(--t3);font-family:var(--mono);font-size:.85rem}

/* stat bar */
.stat-bar{
  display:flex;gap:16px;align-items:center;
  margin-bottom:18px;padding:10px 14px;
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r);
  font-family:var(--mono);font-size:.72rem;color:var(--t2);
}
.stat-num{font-size:1.1rem;font-weight:700;display:block}
.stat-num.g{color:#4ade80}.stat-num.r{color:var(--acc3)}

/* tr tooltip */
[data-tr]{border-bottom:1px dashed var(--t3);cursor:help;position:relative}
[data-tr]::after{
  content:attr(data-tr);position:absolute;bottom:calc(100% + 6px);left:50%;
  transform:translateX(-50%);background:var(--s2);border:1px solid var(--acc2);
  color:var(--acc2);font-size:.68rem;padding:.25rem .6rem;border-radius:5px;
  white-space:nowrap;font-family:var(--mono);pointer-events:none;opacity:0;
  transition:opacity .15s;z-index:10;
}
[data-tr]:hover::after{opacity:1}
[data-tr]:hover{color:var(--acc2)}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>

<div class="header">
  <div class="logo">DM <span>Oefenen</span></div>
  <div class="filters" id="filters"></div>
  <div class="hdr-right">
    <div class="progress-wrap">
      <div class="pbar-label"><span id="pl">0 / 0</span><span id="pp">0%</span></div>
      <div class="pbar"><div class="pbar-fill" id="pf" style="width:0%"></div></div>
    </div>
  </div>
</div>

<div class="main">
  <div class="stat-bar" id="statbar" style="display:none">
    <div><span class="stat-num g" id="sg">0</span>goed</div>
    <div><span class="stat-num r" id="sr">0</span>fout</div>
    <div style="margin-left:auto;color:var(--t3)">klik ✓ / ✗ om bij te houden</div>
  </div>
  <div id="cards"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   ALLE VRAGEN — rechtstreeks uit de 2 PDF's
══════════════════════════════════════════════════════════ */
const QS = [

/* ─── DEMO-EXAMEN: Stellingen ─── */
{
  id:1, tags:['stelling'],
  src:'Demo-examen',
  q:`<span data-tr="Yabancı anahtarlar">FKs (vreemde sleutels)</span> zijn een vorm van <strong>noodzakelijke redundantie</strong> in een <span data-tr="ilişkisel model">relationeel model</span>.`,
  qtype:'waar/vals',
  hint:`Wat betekent "redundantie" precies? Slaat een FK de volledige data opnieuw op, of enkel een verwijzing?`,
  a:`<strong>Vals.</strong><br>Een FK slaat alleen een <em>sleutelwaarde</em> op — geen kopie van de data. Redundantie betekent dat dezelfde data op meerdere plaatsen staat. FKs zorgen voor referentiële integriteit, niet voor duplicatie.`,
  tip:`Onthoud: FK = integriteit. Redundantie = dezelfde data meerdere keren opslaan.`
},
{
  id:2, tags:['stelling'],
  src:'Demo-examen',
  q:`<span data-tr="Mantıksal replikasyon">Logische replicatie</span> kan enkel voor de ganse databank.`,
  qtype:'waar/vals',
  hint:`Wat is het verschil tussen logische en fysieke replicatie? Welke is selectiever?`,
  a:`<strong>Vals.</strong><br>Logische replicatie kan per tabel of zelfs per rij worden geconfigureerd. Dat is net het grote voordeel t.o.v. fysieke replicatie, die de volledige cluster byte-voor-byte kopieert.`,
  tip:`Fysiek = alles. Logisch = selectief (tabel, rij, kolom).`
},

/* ─── OEFENEXAMEN: Stellingen ─── */
{
  id:3, tags:['stelling'],
  src:'Oefenexamen',
  q:`In een <span data-tr="dağıtık sistem">gedistribueerd systeem</span> is het wiskundig mogelijk om Perfecte Consistentie, Hoge Beschikbaarheid en <span data-tr="bölünme toleransı">Partition Tolerance</span> gelijktijdig te bereiken bij gebruik van een moderne PostgreSQL-cluster.`,
  qtype:'waar/onwaar',
  hint:`Herinner je het CAP-theorema. Hoeveel van de drie eigenschappen kan je tegelijk garanderen?`,
  a:`<strong>Onwaar.</strong><br>Dit is het CAP-theorema (Brewer, 2000): in een gedistribueerd systeem kan je maximaal <strong>2 van de 3</strong> eigenschappen tegelijk garanderen. Je moet altijd een trade-off maken.`,
  tip:`CAP = Consistency, Availability, Partition Tolerance → kies 2 van 3.`
},
{
  id:4, tags:['stelling'],
  src:'Oefenexamen',
  q:`Het gebruik van <span data-tr="hazırlanmış ifadeler">Prepared Statements</span> is een primaire verdediging tegen <span data-tr="SQL enjeksiyonu">SQL-injectie</span> omdat de querylogica wordt gescheiden van de data.`,
  qtype:'waar/onwaar',
  hint:`Wat gebeurt er met de inputparameters bij een Prepared Statement? Worden ze geïnterpreteerd als SQL-code?`,
  a:`<strong>Waar.</strong><br>Bij Prepared Statements wordt de SQL-structuur eerst geparsed zonder data. Daarna worden parameters afzonderlijk meegegeven en nooit als SQL-code geïnterpreteerd — injectie is daardoor onmogelijk.`,
  tip:`Parameterwaarden worden altijd als data behandeld, nooit als SQL-instructie.`
},
{
  id:5, tags:['stelling'],
  src:'Oefenexamen',
  q:`Een <code>ACCESS SHARE</code>-lock op een tabel blokkeert andere sessies om een <code>SELECT</code> uit te voeren op diezelfde tabel.`,
  qtype:'waar/onwaar',
  hint:`ACCESS SHARE is de zwakste lock. Welke lock blokkeert SELECT? (hint: het is de zwaarste)`,
  a:`<strong>Onwaar.</strong><br>ACCESS SHARE is de zwakste lock en is compatibel met alle andere locks behalve ACCESS EXCLUSIVE. Meerdere sessies kunnen gelijktijdig een ACCESS SHARE-lock houden. Enkel <code>ACCESS EXCLUSIVE</code> (bv. bij DROP TABLE) blokkeert SELECT.`,
  tip:`ACCESS SHARE blokkeert enkel ACCESS EXCLUSIVE. SELECT blokkeert dus bijna niets.`
},
{
  id:6, tags:['stelling'],
  src:'Oefenexamen',
  q:`Een <code>RANK()</code>-functie zal altijd opeenvolgende gehele getallen retourneren (1, 2, 3…) zelfs wanneer er gelijke waarden (<span data-tr="bağlar">ties</span>) in de data voorkomen.`,
  qtype:'waar/onwaar',
  hint:`Wat doet RANK() als twee rijen dezelfde waarde hebben? En welke functie geeft WEL altijd opeenvolgende getallen?`,
  a:`<strong>Onwaar.</strong><br>Bij gelijke waarden geeft <code>RANK()</code> hetzelfde getal aan beide rijen, maar slaat de volgende rang over.<br>Voorbeeld: twee rijen met rang 2 → de volgende krijgt rang <strong>4</strong>, niet 3.<br>Gebruik <code>DENSE_RANK()</code> voor aaneensluitende nummers.`,
  tip:`RANK: 1,2,2,4 — DENSE_RANK: 1,2,2,3 — ROW_NUMBER: 1,2,3,4`
},
{
  id:7, tags:['stelling'],
  src:'Oefenexamen',
  q:`Een "<span data-tr="sıcak yedekleme">Hot Backup</span>" vereist dat de database volledig wordt afgesloten om gegevensconsistentie tijdens het kopiëren te garanderen.`,
  qtype:'waar/onwaar',
  hint:`Hot backup vs cold backup — wat is het fundamentele verschil?`,
  a:`<strong>Onwaar.</strong><br>Een <em>Hot Backup</em> wordt genomen terwijl de database actief is (online). Een <em>Cold Backup</em> vereist afsluiting. PostgreSQL ondersteunt hot backups via WAL-archivering (<code>pg_basebackup</code>).`,
  tip:`Hot = online (DB draait). Cold = offline (DB gestopt).`
},
{
  id:8, tags:['stelling'],
  src:'Oefenexamen',
  q:`In het isolatieniveau <code>READ COMMITTED</code> kan een transactie gegevenswijzigingen zien die door andere transacties zijn vastgelegd, zelfs als die transacties later zijn gestart.`,
  qtype:'waar/onwaar',
  hint:`Bij READ COMMITTED: wanneer leest een query de data? Per statement of per transactie?`,
  a:`<strong>Waar.</strong><br>Bij READ COMMITTED ziet elke SQL-instructie de meest recente <em>gecommitte</em> data op het moment van uitvoering. Als transactie B na A start maar eerder commit, ziet A die wijzigingen bij haar volgende query. Dit kan leiden tot <strong>Non-Repeatable Reads</strong>.`,
  tip:`READ COMMITTED = per statement een nieuwe snapshot. Gevolg: Non-Repeatable Read mogelijk.`
},
{
  id:9, tags:['stelling'],
  src:'Oefenexamen',
  q:`Een <span data-tr="indeks">index</span> versnelt altijd <code>INSERT</code>- en <code>UPDATE</code>-operaties omdat de database de locatie van de gegevens sneller kan vinden.`,
  qtype:'waar/onwaar',
  hint:`Een index helpt bij lezen. Maar wat moet er bij een INSERT of UPDATE extra gebeuren?`,
  a:`<strong>Onwaar.</strong><br>Een index <em>vertraagt</em> INSERT en UPDATE: bij elke schrijfoperatie moet de index ook bijgewerkt worden. Indexen versnellen SELECT-queries, maar hebben een overhead bij schrijfoperaties.`,
  tip:`Index = sneller lezen (SELECT), trager schrijven (INSERT/UPDATE/DELETE).`
},
{
  id:10, tags:['stelling'],
  src:'Oefenexamen',
  q:`In een "Primary-Replica"-opstelling wordt de replica-node doorgaans gebruikt om schrijfintensieve workloads af te handelen en zo de primary te ontlasten.`,
  qtype:'waar/onwaar',
  hint:`Welke node ontvangt schrijfoperaties in een Primary-Replica setup? En waarvoor dient de replica?`,
  a:`<strong>Onwaar.</strong><br>Schrijfoperaties gaan altijd naar de <strong>primary</strong>. De replica wordt gebruikt voor leesintensieve workloads (<em>read scaling</em>). Schrijven naar een replica zou conflicten veroorzaken.`,
  tip:`Primary = lezen + schrijven. Replica = alleen lezen (read-only).`
},
{
  id:11, tags:['stelling'],
  src:'Oefenexamen',
  q:`Een <span data-tr="tetikleyici">TRIGGER</span> kan zo worden gedefinieerd dat deze vóór of ná een specifieke DML-instructie (<code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>) wordt uitgevoerd.`,
  qtype:'waar/onwaar',
  hint:`Welke timing-opties bestaan er voor triggers? En is er nog een derde optie naast BEFORE en AFTER?`,
  a:`<strong>Waar.</strong><br>In PostgreSQL kies je: <code>BEFORE</code> (voor de operatie — kan de rij aanpassen of annuleren door NULL terug te geven), <code>AFTER</code> (na de operatie — voor side effects), en <code>INSTEAD OF</code> (op views).`,
  tip:`BEFORE: kan operatie stoppen (return NULL). AFTER: voor logging, cascades. INSTEAD OF: op views.`
},
{
  id:12, tags:['stelling'],
  src:'Oefenexamen',
  q:`De <code>UNION</code>-operator verwijdert automatisch dubbele rijen uit de gecombineerde resultaatset, terwijl <code>UNION ALL</code> dat niet doet.`,
  qtype:'waar/onwaar',
  hint:`Wat is het effect van UNION op duplicaten? En waarom zou je UNION ALL kiezen?`,
  a:`<strong>Waar.</strong><br><code>UNION</code> verwijdert duplicaten (doet intern een DISTINCT). <code>UNION ALL</code> behoudt alle rijen inclusief duplicaten en is daardoor <em>sneller</em>.`,
  tip:`Gebruik UNION ALL als je zeker weet dat er geen duplicaten zijn — het scheelt een sorteerstap.`
},
{
  id:13, tags:['stelling'],
  src:'Oefenexamen',
  q:`Een <span data-tr="materyalize edilmiş görünüm">MATERIALIZED VIEW</span> slaat het resultaat van een query fysiek op en moet worden vernieuwd om bijgewerkte gegevens uit de onderliggende tabellen te tonen.`,
  qtype:'waar/onwaar',
  hint:`Wat is het verschil met een gewone VIEW? En hoe vernieuw je een MATERIALIZED VIEW?`,
  a:`<strong>Waar.</strong><br>Een MATERIALIZED VIEW slaat de queryresultaten fysiek op. Ze is snel bij raadplegen maar kan verouderd zijn. Vernieuwen via: <code>REFRESH MATERIALIZED VIEW naam;</code><br>Een gewone VIEW voert de query telkens opnieuw uit — altijd actueel, maar trager.`,
  tip:`Weinig opslagruimte? Gebruik een gewone VIEW. Snelheid nodig? MATERIALIZED VIEW.`
},
{
  id:14, tags:['stelling'],
  src:'Oefenexamen',
  q:`Het <code>GRANT</code>-commando wordt gebruikt om te bepalen welke gebruikers toestemming hebben om specifieke acties zoals <code>SELECT</code> of <code>UPDATE</code> op een tabel uit te voeren.`,
  qtype:'waar/onwaar',
  hint:`Wat is het verschil tussen GRANT en REVOKE?`,
  a:`<strong>Waar.</strong><br><code>GRANT SELECT ON tabel TO gebruiker;</code> geeft leesrecht. <code>REVOKE</code> neemt rechten terug. Dit is onderdeel van <em>privilege management</em> (RBAC) in SQL.`,
  tip:`GRANT = rechten geven. REVOKE = rechten afnemen. Geen DELETE toekennen = gewoon niet GRANTen.`
},
{
  id:15, tags:['stelling'],
  src:'Oefenexamen',
  q:`In PostgreSQL wordt het <code>JSONB</code>-datatype opgeslagen als een ontlede binaire structuur, waardoor het <strong>trager</strong> te verwerken is dan het gewone <code>JSON</code>-teksttype.`,
  qtype:'waar/onwaar',
  hint:`JSONB = binary. JSON = tekst. Welke is sneller bij queries en indexering?`,
  a:`<strong>Onwaar.</strong><br>JSONB is <em>sneller</em> voor queries en ondersteunt indexering, omdat het al geparsed is als binaire structuur. JSON-tekst moet elke keer opnieuw geparsed worden. JSONB is in de meeste gevallen de betere keuze.`,
  tip:`JSONB = sneller lezen/query. JSON = exacte tekst bewaard, iets sneller bij schrijven.`
},
{
  id:16, tags:['stelling'],
  src:'Oefenexamen',
  q:`De clausule <code>OVER (PARTITION BY …)</code> reset de window-berekening telkens wanneer de waarde in de opgegeven kolom verandert.`,
  qtype:'waar/onwaar',
  hint:`Wat doet PARTITION BY precies? Vergelijk het met GROUP BY — wat is het verschil?`,
  a:`<strong>Waar.</strong><br>PARTITION BY verdeelt de resultaatset in groepen. Elke groep wordt onafhankelijk berekend. Vergelijkbaar met GROUP BY, maar alle rijen blijven zichtbaar in het resultaat (geen samenvatting).`,
  tip:`PARTITION BY herstart de window per groep, maar behoudt alle individuele rijen.`
},
{
  id:17, tags:['stelling'],
  src:'Oefenexamen',
  q:`<span data-tr="Yabancı veri sarmalayıcıları">FDW's (Foreign Data Wrappers)</span> maken het mogelijk dat een PostgreSQL-database gegevens uit een extern, volledig ander databasesysteem kan opvragen alsof het een lokale tabel betreft.`,
  qtype:'waar/onwaar',
  hint:`Wat is het nut van een FDW? Welke externe bronnen kunnen aangekoppeld worden?`,
  a:`<strong>Waar.</strong><br>Via FDW koppel je externe bronnen aan PostgreSQL: andere PostgreSQL-instanties (<code>postgres_fdw</code>), MySQL (<code>mysql_fdw</code>), CSV-bestanden (<code>file_fdw</code>), REST APIs, etc. De externe data verschijnt als een lokale "foreign table".`,
  tip:`FDW = brug naar externe data. De data staat extern maar gedraagt zich als een lokale tabel.`
},

/* ─── DEMO-EXAMEN vraag 2: ACID ─── */
{
  id:20, tags:['theorie'],
  src:'Demo-examen v2',
  q:`Waarvoor staat <span data-tr="ACID kısaltması">ACID</span>? Leg duidelijk en volledig uit wat hiermee bedoeld wordt.`,
  qtype:'open',
  hint:`Probeer eerst zelf elk letter uit te schrijven. Wat garandeert elke eigenschap precies?`,
  a:`<strong>A — Atomicity (Atoomgehalte):</strong><br>Een transactie is ondeelbaar. Alles slaagt of niets slaagt. Bij een fout halverwege worden alle wijzigingen teruggedraaid.<br><br>
<strong>C — Consistency (Consistentie):</strong><br>De database gaat van één geldige toestand naar een andere. Alle constraints, regels en integriteit blijven gerespecteerd na elke transactie.<br><br>
<strong>I — Isolation (Isolatie):</strong><br>Parallelle transacties beïnvloeden elkaar niet. Elke transactie werkt alsof ze de enige is — neveneffecten afhankelijk van het isolatieniveau.<br><br>
<strong>D — Durability (Duurzaamheid):</strong><br>Na een COMMIT zijn de wijzigingen permanent opgeslagen, ook bij een systeemcrash of stroomonderbreking.`,
  tip:`Ezelsbruggetje: "Alles Correct Is Duurzaam"`
},

/* ─── DEMO-EXAMEN vraag 3: Phantom Read ─── */
{
  id:21, tags:['theorie'],
  src:'Demo-examen v3',
  q:`Wat is een '<span data-tr="hayalet okuma">Phantom Read</span>'? Hoe kunnen we dit fenomeen vermijden? Geef een concreet voorbeeld. (ook SQL-code verwacht)`,
  qtype:'open',
  hint:`Een Phantom Read gaat over rijen die "verschijnen" of "verdwijnen". Welk isolatieniveau vermijdt dit? En wat is het verschil met een Non-Repeatable Read?`,
  a:`Een <strong>Phantom Read</strong> treedt op wanneer transactie A dezelfde query tweemaal uitvoert en de tweede keer andere rijen ziet — niet omdat bestaande rijen gewijzigd zijn, maar omdat transactie B tussenin rijen <em>toevoegde of verwijderde</em>.
<pre><span class="cm">-- Transactie A, eerste lezing:</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> orders <span class="kw">WHERE</span> bedrag > <span class="num">100</span>;
<span class="cm">-- → 5 rijen</span>

<span class="cm">-- Transactie B commit (tussenin):</span>
<span class="kw">INSERT INTO</span> orders (bedrag) <span class="kw">VALUES</span> (<span class="num">150</span>);
<span class="kw">COMMIT</span>;

<span class="cm">-- Transactie A, tweede lezing (zelfde query):</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> orders <span class="kw">WHERE</span> bedrag > <span class="num">100</span>;
<span class="cm">-- → 6 rijen  ← PHANTOM READ</span></pre>
<strong>Vermijden:</strong>
<pre><span class="kw">SET TRANSACTION ISOLATION LEVEL SERIALIZABLE</span>;
<span class="cm">-- of:</span>
<span class="kw">SET TRANSACTION ISOLATION LEVEL REPEATABLE READ</span>;</pre>`,
  tip:`Phantom = nieuwe/verdwenen rijen. Non-Repeatable = gewijzigde waarden in bestaande rijen.`
},

/* ─── DEMO-EXAMEN vraag 5: tennis NOT IN / NOT EXISTS ─── */
{
  id:23, tags:['sql'],
  src:'Demo-examen v5',
  q:`Geef alle spelers die <strong>nog nooit een boete van 50 euro</strong> hebben gehad. (Tennis databank: tabellen <code>SPELERS</code> en <code>BOETES</code>)<br><br>Geef <strong>twee duidelijk verschillende</strong> query-strategieën.`,
  qtype:'open',
  hint:`Strategie 1: gebruik NOT IN met een subquery. Strategie 2: gebruik NOT EXISTS. Wat is het gevaar van NOT IN als de subquery NULLs bevat?`,
  a:`<strong>Strategie 1: NOT IN</strong>
<pre><span class="kw">SELECT</span> *
<span class="kw">FROM</span> SPELERS
<span class="kw">WHERE</span> SPELERSNR <span class="kw">NOT IN</span> (
    <span class="kw">SELECT</span> SPELERSNR
    <span class="kw">FROM</span> BOETES
    <span class="kw">WHERE</span> BEDRAG = <span class="num">50</span>
);</pre>
<strong>Strategie 2: NOT EXISTS</strong>
<pre><span class="kw">SELECT</span> s.*
<span class="kw">FROM</span> SPELERS s
<span class="kw">WHERE NOT EXISTS</span> (
    <span class="kw">SELECT</span> <span class="num">1</span>
    <span class="kw">FROM</span> BOETES b
    <span class="kw">WHERE</span> b.SPELERSNR = s.SPELERSNR
      <span class="kw">AND</span> b.BEDRAG = <span class="num">50</span>
);</pre>

<pre><span class="kw">SELECT</span> s.*
<span class="kw">FROM</span> SPELERS s
<span class="kw">LEFT JOIN</span> BOETES b
  <span class="kw">ON</span> s.SPELERSNR = b.SPELERSNR
  <span class="kw">AND</span> b.BEDRAG = <span class="num">50</span>
<span class="kw">WHERE</span> b.BETALINGSNR <span class="kw">IS NULL</span>;</pre>`,
  tip:`⚠️ NOT IN + NULL in subquery = altijd lege resultaatset! NOT EXISTS is immuun voor dit probleem.`

/* ─── DEMO-EXAMEN vraag 9: Procedure verwijder_uit_abonnement ─── */
{
  id:27, tags:['procedure'],
  src:'Demo-examen v9',
  q:`Schrijf een <strong>script met procedure</strong> <code>verwijder_uit_abonnement(p_abonnementid INT)</code>:<br><br>
• Als er <strong>geen afhankelijkheden</strong> zijn in tabel <code>telefoneren</code>: verwijder de rij uit <code>abonnementen</code><br>
• Als er <strong>wel afhankelijkheden</strong> zijn: toon concrete foutboodschap (bv. "er wordt naar de waarde X verwezen in de tabel telefoneren…")<br>
• Procedure mag <strong>nooit een fout geven</strong> ongeacht de invoer<br>
• Gebruik een <strong>transactie</strong> om de procedure op te slaan`,
  qtype:'open',
  hint:`"Nooit een fout geven" → gebruik RAISE INFO, niet RAISE EXCEPTION. Controleer eerst of er afhankelijkheden bestaan met COUNT(*). Omsluit in BEGIN ... COMMIT.`,
  a:`<pre><span class="kw">BEGIN</span>;

<span class="kw">CREATE OR REPLACE PROCEDURE</span>
  <span class="fn">verwijder_uit_abonnement</span>(p_abonnementid <span class="kw">INT</span>)
<span class="kw">LANGUAGE plpgsql AS</span> $$
<span class="kw">DECLARE</span>
    v_count <span class="kw">INT</span>;
<span class="kw">BEGIN</span>
    <span class="cm">-- Controleer afhankelijkheden in telefoneren</span>
    <span class="kw">SELECT COUNT</span>(*) <span class="kw">INTO</span> v_count
    <span class="kw">FROM</span> telefoneren
    <span class="kw">WHERE</span> abonnementid = p_abonnementid;

    <span class="kw">IF</span> v_count > <span class="num">0</span> <span class="kw">THEN</span>
        <span class="fn">RAISE INFO</span>
          <span class="str">'er wordt naar de waarde % verwezen in de tabel telefoneren, gelieve deze eerst te verwijderen'</span>,
          p_abonnementid;
    <span class="kw">ELSE</span>
        <span class="kw">DELETE FROM</span> abonnementen
        <span class="kw">WHERE</span> abonnementid = p_abonnementid;
        <span class="fn">RAISE INFO</span> <span class="str">'Abonnement % succesvol verwijderd.'</span>, p_abonnementid;
    <span class="kw">END IF</span>;
<span class="kw">EXCEPTION WHEN OTHERS THEN</span>
    <span class="fn">RAISE INFO</span> <span class="str">'Onverwachte fout: %'</span>, <span class="fn">SQLERRM</span>;
<span class="kw">END</span>;
$$;

<span class="cm">-- Test:</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> abonnementen;
<span class="kw">CALL</span> <span class="fn">verwijder_uit_abonnement</span>(<span class="num">1</span>);  <span class="cm">-- zonder afhankelijkheid</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> abonnementen;
<span class="kw">CALL</span> <span class="fn">verwijder_uit_abonnement</span>(<span class="num">2</span>);  <span class="cm">-- met afhankelijkheid</span>
<span class="kw">SELECT</span> * <span class="kw">FROM</span> abonnementen;

<span class="kw">COMMIT</span>;</pre>`,
  tip:`RAISE INFO = informatief bericht, geen echte fout. RAISE EXCEPTION = breekt de transactie. De vraag zegt "mag geen fout geven" → RAISE INFO.`
},

/* ─── OEFENEXAMEN vraag 3: Transactie-uitvoer READ COMMITTED ─── */
{
  id:31, tags:['transactie'],
  src:'Oefenexamen v3',
  q:`Isolatieniveau: <strong>READ COMMITTED</strong>. De volgende instructies worden chronologisch uitgevoerd:
<pre><span class="cm">-- Jef:</span>
<span class="kw">START TRANSACTION</span>;
<span class="kw">SELECT</span> status <span class="kw">FROM</span> Shipment <span class="kw">WHERE</span> shipment_id = <span class="num">500</span>; <span class="cm">-- 'Pending'</span>
<span class="kw">UPDATE</span> Shipment <span class="kw">SET</span> status = <span class="str">'In Transit'</span> <span class="kw">WHERE</span> shipment_id = <span class="num">500</span>;
<span class="cm">-- A: Bob leest: SELECT status FROM Shipment WHERE shipment_id = 500;</span>
<span class="kw">SAVEPOINT</span> s1;
<span class="kw">UPDATE</span> Shipment <span class="kw">SET</span> status = <span class="str">'Arrived'</span> <span class="kw">WHERE</span> shipment_id = <span class="num">500</span>;
<span class="cm">-- B: Bob leest opnieuw</span>
<span class="kw">ROLLBACK TO SAVEPOINT</span> s1;
<span class="cm">-- C: Jef leest: SELECT status FROM Shipment WHERE shipment_id = 500;</span>
<span class="kw">COMMIT</span>;
<span class="cm">-- D: Bob leest opnieuw</span>
<span class="kw">ROLLBACK</span>;
<span class="cm">-- E: Bob leest opnieuw</span></pre>
Wat is de output bij A, B, C, D en E?`,
  qtype:'open',
  hint:`READ COMMITTED: je ziet enkel gecommitte data. Jef heeft nog niet gecommit op A en B. Wat ziet Bob dan? Op C: Jef leest zijn eigen uncommitted wijziging. Op D: Jef heeft gecommit — wat is de status?`,
  a:`<strong>A</strong> (Bob, Jef heeft 'In Transit' geschreven maar nog niet gecommit):<br>
→ <code>'Pending'</code> — READ COMMITTED = geen dirty reads. Bob ziet de laatste gecommitte waarde.<br><br>
<strong>B</strong> (Bob, Jef heeft 'Arrived' geschreven, maar nog niet gecommit):<br>
→ <code>'Pending'</code> — Nog steeds niet gecommit. Bob ziet nog altijd 'Pending'.<br><br>
<strong>C</strong> (Jef, na ROLLBACK TO SAVEPOINT s1):<br>
→ <code>'In Transit'</code> — Binnen zijn eigen transactie ziet Jef zijn eigen wijziging. 'Arrived' is teruggedraaid naar s1, dus de status is terug 'In Transit'.<br><br>
<strong>D</strong> (Bob, Jef heeft COMMIT gedaan met status 'In Transit'):<br>
→ <code>'In Transit'</code> — Jef heeft gecommit. Bob ziet nu de gecommitte waarde.<br><br>
<strong>E</strong> (Bob, na ROLLBACK van... Jef heeft al gecommit):<br>
→ <code>'In Transit'</code> — De ROLLBACK na COMMIT heeft geen effect. 'In Transit' is permanent.`,
  tip:`Sleutelregel: READ COMMITTED = geen dirty reads. Je ziet altijd de meest recente GECOMMITTE staat.`
},

/* ─── OEFENEXAMEN vraag 4: Query uitvoer met window + FILTER ─── */
{
  id:32, tags:['sql','window'],
  src:'Oefenexamen v4',
  q:`Geef de resultaatset van deze query (of leg de fout uit als de query niet werkt):
<pre><span class="kw">SELECT</span>
    s.origin_city, l.leg_id, l.parent_leg_id,
    <span class="fn">sum</span>(l.distance_km) <span class="kw">OVER</span> (<span class="kw">ORDER BY</span> l.start_date <span class="kw">ASC</span>) <span class="kw">as</span> total_dist,
    s.status,
    <span class="kw">CASE</span>
        <span class="kw">WHEN</span> s.status = <span class="str">'In Transit'</span>
        <span class="kw">THEN</span> <span class="fn">count</span>(l.parent_leg_id) <span class="kw">FILTER</span> (<span class="kw">WHERE</span> l.parent_leg_id <span class="kw">IS NOT NULL</span>)
        <span class="kw">WHEN</span> s.status = <span class="str">'Arrived'</span>
        <span class="kw">THEN</span> <span class="fn">count</span>(l.leg_id) <span class="kw">FILTER</span> (<span class="kw">WHERE</span> l.distance_km > <span class="num">500</span>)
    <span class="kw">END AS</span> logic_check
<span class="kw">FROM</span> shipment s
<span class="kw">LEFT OUTER JOIN</span> leg l <span class="kw">ON</span> (s.shipment_id = l.shipment_id)
<span class="kw">GROUP BY</span> s.origin_city, l.leg_id, l.parent_leg_id, l.start_date, s.status, l.distance_km
<span class="kw">ORDER BY</span> l.start_date <span class="kw">ASC</span>;</pre>
Data: Shipment(10,'Antwerp','New York',500,'In Transit'), (20,'Brussels','Tokyo',1200,'Arrived'), (30,'Ghent','London',350,'Pending').<br>
Leg: L1(10,null,100,'2026-01-01'), L2(10,L1,250,'2026-01-05'), L3(20,null,800,'2026-02-10'), L4(20,L3,150,'2026-02-15').`,
  qtype:'open',
  hint:`Werk stap voor stap: eerst de JOIN (welke rijen?), dan GROUP BY (wat groepeert het?), dan de window (cumulatief over start_date), dan de CASE per status. Wat is logic_check voor 'Pending' (geen WHEN)?`,
  a:`De query werkt. GROUP BY groepeert per (origin_city, leg_id, parent_leg_id, start_date, status, distance_km) — elke leg is al uniek, dus elke groep heeft 1 rij.<br><br>
<strong>Resultaat (gesorteerd op start_date):</strong>
<pre>origin_city | leg_id | parent_leg_id | total_dist | status     | logic_check
------------+--------+---------------+------------+------------+------------
Antwerp     | L1     | null          |        100 | In Transit |     0
Antwerp     | L2     | L1            |        350 | In Transit |     1
Brussels    | L3     | null          |       1150 | Arrived    |     1
Brussels    | L4     | L3            |       1300 | Arrived    |     0
Ghent       | null   | null          |       1300 | Pending    |  null</pre>
Toelichting:<br>
• <code>total_dist</code>: cumulatieve som over alle rijen gesorteerd op start_date<br>
• 'In Transit': count(parent_leg_id IS NOT NULL) → L1=0 (null parent), L2=1 (heeft parent)<br>
• 'Arrived': count(distance_km > 500) → L3=1 (800>500), L4=0 (150≤500)<br>
• 'Pending': geen WHEN → <code>NULL</code><br>
• Ghent (shipment 30) heeft geen legs → LEFT JOIN geeft null-rij`,
  tip:`CASE WHEN zonder ELSE geeft NULL. LEFT JOIN behoudt shipments zonder legs (Ghent/Pending).`
},

/* ─── OEFENEXAMEN vraag 5: Query equivalentie + performantie ─── */
{
  id:33, tags:['sql','performantie'],
  src:'Oefenexamen v5',
  q:`Zijn de twee queries equivalent? Welke is het meest geoptimaliseerd?<br><br>
<strong>Query 1:</strong>
<pre><span class="kw">SELECT SUM</span>(s.weight)
<span class="kw">FROM</span> shipment s, leg l, assignment a, container c
<span class="kw">WHERE</span> s.shipment_id = l.shipment_id
  <span class="kw">AND</span> l.leg_id = a.leg_id
  <span class="kw">AND</span> a.container_id = c.container_id
  <span class="kw">AND</span> c.type = <span class="str">'Refrigerated'</span>;</pre>
<strong>Query 2:</strong>
<pre><span class="kw">SELECT SUM</span>(weight)
<span class="kw">FROM</span> shipment
<span class="kw">WHERE</span> shipment_id <span class="kw">IN</span> (
    <span class="kw">SELECT</span> l.shipment_id
    <span class="kw">FROM</span> leg l
    <span class="kw">JOIN</span> assignment a <span class="kw">ON</span> l.leg_id = a.leg_id
    <span class="kw">JOIN</span> container c <span class="kw">ON</span> a.container_id = c.container_id
    <span class="kw">WHERE</span> c.type = <span class="str">'Refrigerated'</span>
);</pre>
Query plan 1: Execution Time 7.782ms. Query plan 2: Execution Time 3.897ms.`,
  qtype:'open',
  hint:`Wat als een shipment meerdere legs heeft die in meerdere 'Refrigerated' containers zitten? Telt Query 1 het gewicht dan meerdere keren? En wat doet IN in Query 2?`,
  a:`<strong>Equivalentie: niet altijd equivalent!</strong><br>
Als een shipment meerdere legs heeft die elk in een 'Refrigerated' container zitten, telt Query 1 het gewicht van dat shipment <em>meerdere keren</em> (door de reguliere JOIN-duplicaten). Query 2 gebruikt IN, wat een ship maar één keer telt ongeacht het aantal matches.<br><br>
<strong>Als de data geen duplicaten veroorzaakt</strong>: ze zijn functioneel equivalent.<br><br>
<strong>Performantie: Query 2 is sneller</strong> (3.9ms vs 7.8ms).<br>
Reden: Query 2 gebruikt intern een <em>Hash Semi Join</em> — zodra één match gevonden is per shipment stopt de zoektocht. Query 1 verwerkt alle matches. De query plan bevestigt: "Hash Semi Join" in Query 2 vs "Hash Join" in Query 1.`,
  tip:`Semi Join (IN, EXISTS) = stopt bij eerste match. Reguliere JOIN = verwerkt alle matches. Semi Join is efficiënter én veiliger voor aggregaties.`
},

/* ─── OEFENEXAMEN vraag 6: VIEW / persistente opslag ─── */
{
  id:34, tags:['sql','theorie'],
  src:'Oefenexamen v6',
  q:`De klant heeft <strong>onvoldoende opslagruimte</strong>. Hij wil een query die cumulatief gewicht per <code>destination_city</code> toont, als <strong>persistent object</strong> opslaan.<br><br>
a. Schrijf de query (shipment_id, destination_city, weight, cumulatief totaal per stad).<br>
b. Geef <strong>twee duidelijk verschillende</strong> manieren om dit persistent te maken, elk met een script.`,
  qtype:'open',
  hint:`Onvoldoende opslag → MATERIALIZED VIEW kan niet (slaat data fysiek op). Welke twee alternatieven blijven over? Denk aan VIEW en functies/procedures.`,
  a:`<strong>a. De query:</strong>
<pre><span class="kw">SELECT</span>
    shipment_id,
    destination_city,
    weight,
    <span class="fn">SUM</span>(weight) <span class="kw">OVER</span> (
        <span class="kw">PARTITION BY</span> destination_city
        <span class="kw">ORDER BY</span> shipment_id
    ) <span class="kw">AS</span> totaal_gewicht_tot_nu
<span class="kw">FROM</span> shipment;</pre>
<strong>b. Methode 1: Gewone VIEW</strong>
<pre><span class="kw">CREATE OR REPLACE VIEW</span> gewicht_per_stad <span class="kw">AS</span>
<span class="kw">SELECT</span>
    shipment_id, destination_city, weight,
    <span class="fn">SUM</span>(weight) <span class="kw">OVER</span> (
        <span class="kw">PARTITION BY</span> destination_city
        <span class="kw">ORDER BY</span> shipment_id
    ) <span class="kw">AS</span> totaal_gewicht_tot_nu
<span class="kw">FROM</span> shipment;</pre>
<strong>Methode 2: SQL-functie</strong>
<pre><span class="kw">CREATE OR REPLACE FUNCTION</span> <span class="fn">get_gewicht_per_stad</span>()
<span class="kw">RETURNS TABLE</span>(
    shipment_id <span class="kw">INT</span>,
    destination_city <span class="kw">VARCHAR</span>,
    weight <span class="kw">DECIMAL</span>,
    totaal_gewicht_tot_nu <span class="kw">DECIMAL</span>
) <span class="kw">AS</span> $$
    <span class="kw">SELECT</span>
        shipment_id, destination_city, weight,
        <span class="fn">SUM</span>(weight) <span class="kw">OVER</span> (<span class="kw">PARTITION BY</span> destination_city <span class="kw">ORDER BY</span> shipment_id)
    <span class="kw">FROM</span> shipment;
$$ <span class="kw">LANGUAGE SQL</span>;</pre>`,
  tip:`Geen opslag = geen MATERIALIZED VIEW. VIEW is altijd actueel maar gebruikt geen opslag. Functie geeft meer flexibiliteit (parameters mogelijk).`
},

/* ─── OEFENEXAMEN vraag 7: Recursieve CTE ─── */
{
  id:35, tags:['sql'],
  src:'Oefenexamen v7',
  q:`Schrijf een query die <strong>alle sub-legs</strong> toont van de leg met naam <code>'Pacific Transit'</code>.<br><br>
Zorg dat de volledige hiërarchie wordt weergegeven, inclusief sub-legs van sub-legs, totdat er geen verdere sub-legs meer zijn. De diepte is onbekend.`,
  qtype:'open',
  hint:`Onbekende diepte → recursieve CTE. Wat is het basisgeval? Wat is de recursieve stap? Hoe stop je de recursie?`,
  a:`<pre><span class="kw">WITH RECURSIVE</span> sub_legs <span class="kw">AS</span> (
    <span class="cm">-- Basisgeval: vind de startleg 'Pacific Transit'</span>
    <span class="kw">SELECT</span>
        leg_id, name, shipment_id,
        parent_leg_id, start_date, origin,
        destination, distance_km,
        <span class="num">0</span> <span class="kw">AS</span> diepte
    <span class="kw">FROM</span> Leg
    <span class="kw">WHERE</span> name = <span class="str">'Pacific Transit'</span>

    <span class="kw">UNION ALL</span>

    <span class="cm">-- Recursieve stap: zoek kinderen van huidige rijen</span>
    <span class="kw">SELECT</span>
        l.leg_id, l.name, l.shipment_id,
        l.parent_leg_id, l.start_date, l.origin,
        l.destination, l.distance_km,
        sl.diepte + <span class="num">1</span>
    <span class="kw">FROM</span> Leg l
    <span class="kw">INNER JOIN</span> sub_legs sl <span class="kw">ON</span> l.parent_leg_id = sl.leg_id
)
<span class="kw">SELECT</span> * <span class="kw">FROM</span> sub_legs
<span class="kw">WHERE</span> diepte > <span class="num">0</span>  <span class="cm">-- enkel de sub-legs, niet de startleg zelf</span>
<span class="kw">ORDER BY</span> diepte, leg_id;</pre>`,
  tip:`Basisgeval = de startleg. Recursieve stap = JOIN op parent_leg_id = vorige leg_id. Stopt automatisch als geen kinderen meer gevonden worden.`
},

/* ─── OEFENEXAMEN vraag 9: Trigger ─── */
{
  id:37, tags:['procedure'],
  src:'Oefenexamen v9',
  q:`Schrijf een <strong>triggerfunctie</strong> die automatisch de status van een <code>Container</code> bijwerkt naar <code>'Full'</code> wanneer de som van de gewichten van de toegewezen Shipments de capaciteit van die Container bereikt.`,
  qtype:'open',
  hint:`Wanneer triggert dit? Na een INSERT op Assignment. Wat moet je berekenen? De som van gewichten van alle shipments die aan die container zijn toegewezen via legs. Vergelijk met de capaciteit van de container.`,
  a:`<pre><span class="kw">CREATE OR REPLACE FUNCTION</span> <span class="fn">check_container_capacity</span>()
<span class="kw">RETURNS TRIGGER LANGUAGE plpgsql AS</span> $$
<span class="kw">DECLARE</span>
    v_gewicht   <span class="kw">DECIMAL</span>;
    v_capaciteit <span class="kw">DECIMAL</span>;
<span class="kw">BEGIN</span>
    <span class="cm">-- Som van gewichten van alle shipments in deze container</span>
    <span class="kw">SELECT</span> <span class="fn">COALESCE</span>(<span class="fn">SUM</span>(s.weight), <span class="num">0</span>)
    <span class="kw">INTO</span> v_gewicht
    <span class="kw">FROM</span> Assignment a
    <span class="kw">JOIN</span> Leg l      <span class="kw">ON</span> a.leg_id = l.leg_id
    <span class="kw">JOIN</span> Shipment s <span class="kw">ON</span> l.shipment_id = s.shipment_id
    <span class="kw">WHERE</span> a.container_id = NEW.container_id;

    <span class="cm">-- Capaciteit van de container</span>
    <span class="kw">SELECT</span> capacity <span class="kw">INTO</span> v_capaciteit
    <span class="kw">FROM</span> Container
    <span class="kw">WHERE</span> container_id = NEW.container_id;

    <span class="kw">IF</span> v_gewicht >= v_capaciteit <span class="kw">THEN</span>
        <span class="kw">UPDATE</span> Container
        <span class="kw">SET</span> status = <span class="str">'Full'</span>
        <span class="kw">WHERE</span> container_id = NEW.container_id;
    <span class="kw">END IF</span>;

    <span class="kw">RETURN NEW</span>;
<span class="kw">END</span>;
$$;

<span class="kw">CREATE TRIGGER</span> trg_container_vol
<span class="kw">AFTER INSERT OR UPDATE ON</span> Assignment
<span class="kw">FOR EACH ROW</span>
<span class="kw">EXECUTE FUNCTION</span> <span class="fn">check_container_capacity</span>();</pre>`,
  tip:`NEW.container_id verwijst naar de net ingevoegde Assignment-rij. COALESCE voorkomt NULL bij lege som.`
},

/* ─── OEFENEXAMEN vraag 10: ROLLUP ─── */
{
  id:38, tags:['sql','window'],
  src:'Oefenexamen v10',
  q:`Schrijf een query die per <code>destination_city</code> en per <code>status</code> het totale gewicht toont, <strong>met subtotaal per stad én algemeen totaal</strong>.<br><br>
Verplichte kolommen: <code>destination_city</code>, <code>status</code>, <code>total_weight</code>.`,
  qtype:'open',
  hint:`Subtotalen per stad + algemeen totaal → welke GROUP BY extensie gebruik je? ROLLUP, CUBE, of GROUPING SETS?`,
  a:`<pre><span class="kw">SELECT</span>
    destination_city,
    status,
    <span class="fn">SUM</span>(weight) <span class="kw">AS</span> total_weight
<span class="kw">FROM</span> shipment
<span class="kw">GROUP BY ROLLUP</span> (destination_city, status)
<span class="kw">ORDER BY</span> destination_city <span class="kw">NULLS LAST</span>, status <span class="kw">NULLS LAST</span>;</pre>
<code>ROLLUP(a, b)</code> genereert automatisch:<br>
• Gedetailleerde rijen: (city, status)<br>

  tip:`ROLLUP = hiërarchisch. CUBE = alle combinaties. GROUPING SETS = zelf kiezen. Bij "subtotaal per stad + totaal" → ROLLUP.`

/* ─── OEFENEXAMEN vraag 11: INNER JOIN vs INTERSECT ─── */
{
  id:39, tags:['theorie'],
  src:'Oefenexamen v11',
  q:`Leg het verschil uit tussen een <code>INNER JOIN</code> en <code>INTERSECT</code> in SQL. Geef ook een voorbeeld van wanneer je elk gebruikt.`,
  qtype:'open',
  hint:`Denk aan: wat combineer je bij een JOIN? Kolommen of rijen? En bij INTERSECT?`,
  a:`<strong>INNER JOIN:</strong><br>
Combineert rijen uit twee tabellen op basis van een join-conditie. Retourneert kolommen uit beide tabellen. Kan duplicaten produceren als de join-kolom niet uniek is.
<pre><span class="kw">SELECT</span> s.shipment_id, l.leg_id
<span class="kw">FROM</span> Shipment s
<span class="kw">INNER JOIN</span> Leg l <span class="kw">ON</span> s.shipment_id = l.shipment_id;</pre>
→ Gebruik bij: gerelateerde data uit meerdere tabellen samenvoegen.<br><br>
<strong>INTERSECT:</strong><br>
Geeft enkel de rijen terug die in beide resultaatsets voorkomen. Werkt op volledige rijen (alle kolommen moeten overeenkomen). Verwijdert automatisch duplicaten.
<pre><span class="kw">SELECT</span> destination_city <span class="kw">FROM</span> shipment <span class="kw">WHERE</span> status = <span class="str">'Arrived'</span>
<span class="kw">INTERSECT</span>
<span class="kw">SELECT</span> destination_city <span class="kw">FROM</span> shipment <span class="kw">WHERE</span> weight > <span class="num">1000</span>;</pre>
→ Gebruik bij: gemeenschappelijke elementen vinden tussen twee onafhankelijke sets.`,
  tip:`JOIN = kolommen samenvoegen op conditie. INTERSECT = gemeenschappelijke rijen vinden.`
},

/* ══════════════════════════════════════════════════════════
   SCORE & FILTER STATE
══════════════════════════════════════════════════════════ */
let scores = {};
let activeTag = 'all';

const allTags = ['all', ...new Set(QS.flatMap(q => q.tags))];
const tagLabels = {
  all:'Alle vragen',stelling:'Stellingen',theorie:'Theorie',
  sql:'SQL Queries',ddl:'DDL',procedure:'Procedures',
  transactie:'Transacties',window:'Window Functions',
  performantie:'Performantie',security:'Beveiliging'
};

/* ── BUILD FILTERS ── */
const fwrap = document.getElementById('filters');
allTags.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'fb' + (t === 'all' ? ' on' : '');
  btn.dataset.tag = t;
  const cnt = t === 'all' ? QS.length : QS.filter(q => q.tags.includes(t)).length;
  btn.innerHTML = `${tagLabels[t]||t} <span style="opacity:.55;font-size:.62rem">${cnt}</span>`;
  btn.onclick = () => {
    document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    activeTag = t;
    render();
  };
  fwrap.appendChild(btn);
});

/* ── RENDER ── */
function render() {
  const list = activeTag === 'all' ? QS : QS.filter(q => q.tags.includes(activeTag));
  const container = document.getElementById('cards');
  if (!list.length) { container.innerHTML = '<div class="empty">Geen vragen in deze categorie.</div>'; return; }

  container.innerHTML = list.map(q => {
    const sc = scores[q.id];
    return `
    <div class="qcard" id="qc-${q.id}">
      <div class="qcard-head">
        <span class="qnum">#${q.id}</span>
        <div style="flex:1">
          <div class="qsource">${q.src}</div>
        </div>
        <div class="qtags">
          ${q.tags.map(t=>`<span class="qtag tag-${t}">${tagLabels[t]||t}</span>`).join('')}
          <span class="qtag" style="background:rgba(255,255,255,.05);color:var(--t2)">${q.qtype}</span>
        </div>
      </div>
      <div class="qbody">
        <div class="qtext">${q.q}</div>
        ${q.hint ? `<div class="hint-box">💭 ${q.hint}</div>` : ''}
      </div>
      <div class="qactions">
        <button class="btn-show" onclick="toggle(${q.id})">Toon antwoord ▾</button>
        <button class="btn-mark ok ${sc==='ok'?'selected-ok':''}" onclick="mark(${q.id},'ok')">✓ Correct</button>
        <button class="btn-mark err ${sc==='err'?'selected-err':''}" onclick="mark(${q.id},'err')">✗ Fout</button>
      </div>
      <div class="answer-block" id="ans-${q.id}">
        <div class="alabel">▸ Antwoord</div>
        <div class="answer-text">${q.a}${q.tip?`<div class="tip-strip">💡 ${q.tip}</div>`:''}</div>
      </div>
    </div>`;
  }).join('');
  updateStats();
}

function toggle(id) {
  const b = document.getElementById(`ans-${id}`);
  const btn = b.previousElementSibling.querySelector('.btn-show');
  const open = b.classList.toggle('open');
  btn.textContent = open ? 'Verberg antwoord ▴' : 'Toon antwoord ▾';
}

function mark(id, result) {
  scores[id] = scores[id] === result ? undefined : result;
  const card = document.getElementById(`qc-${id}`);
  card.querySelector('.btn-mark.ok').className = `btn-mark ok${scores[id]==='ok'?' selected-ok':''}`;
  card.querySelector('.btn-mark.err').className = `btn-mark err${scores[id]==='err'?' selected-err':''}`;
  updateStats();
}

function updateStats() {
  const total = QS.length;
  const ok = Object.values(scores).filter(v=>v==='ok').length;
  const err = Object.values(scores).filter(v=>v==='err').length;
  const done = ok + err;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('pl').textContent = `${done} / ${total}`;
  document.getElementById('pp').textContent = `${pct}%`;
  document.getElementById('pf').style.width = pct + '%';
  document.getElementById('sg').textContent = ok;
  document.getElementById('sr').textContent = err;
  document.getElementById('statbar').style.display = done > 0 ? 'flex' : 'none';
}

render();
</script>
</body>
</html>
