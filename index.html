<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM Study Companion</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0f;
  --s1:#131318;
  --s2:#1a1a22;
  --s3:#22222e;
  --border:#2a2a38;
  --border2:#3a3a50;
  --acc:#6c63ff;
  --acc2:#00d4aa;
  --acc3:#ff6b6b;
  --acc4:#ffd93d;
  --text:#e8e8f0;
  --t2:#8888a8;
  --t3:#4a4a68;
  --mono:'IBM Plex Mono',monospace;
  --sans:'Syne',sans-serif;
  --r:10px;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── TOP BAR ── */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;
  border-bottom:1px solid var(--border);
  background:var(--s1);
  flex-shrink:0;
}
.logo{font-size:1rem;font-weight:800;letter-spacing:-.02em}
.logo em{color:var(--acc);font-style:normal}
.mode-pills{display:flex;gap:6px;margin-left:auto}
.pill{
  font-family:var(--mono);font-size:0.7rem;padding:4px 12px;
  border-radius:99px;border:1px solid var(--border);
  color:var(--t2);cursor:pointer;background:transparent;transition:all .15s;
}
.pill:hover{border-color:var(--acc);color:var(--text)}
.pill.active{background:var(--acc);border-color:var(--acc);color:#fff}
.kb-hint{font-family:var(--mono);font-size:0.65rem;color:var(--t3)}

/* ── LAYOUT ── */
.workspace{display:flex;flex:1;overflow:hidden}

/* ── LEFT: EDITOR ── */
.editor-pane{
  display:flex;flex-direction:column;
  width:55%;border-right:1px solid var(--border);
  flex-shrink:0;
}
.editor-header{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;border-bottom:1px solid var(--border);
  background:var(--s2);flex-shrink:0;
}
.editor-label{font-family:var(--mono);font-size:0.7rem;color:var(--t2)}
.topic-select{
  font-family:var(--mono);font-size:0.72rem;background:var(--s3);
  border:1px solid var(--border);color:var(--text);
  padding:4px 8px;border-radius:6px;cursor:pointer;
  margin-left:auto;
}
.editor-wrap{position:relative;flex:1;display:flex;flex-direction:column;overflow:hidden}

/* code editor */
.code-area{
  flex:1;resize:none;
  background:var(--bg);color:var(--text);
  font-family:var(--mono);font-size:0.82rem;line-height:1.65;
  border:none;outline:none;padding:16px;
  tab-size:4;overflow-y:auto;
  caret-color:var(--acc2);
}
.code-area::placeholder{color:var(--t3)}

/* autocomplete dropdown */
.autocomplete{
  position:absolute;left:0;right:0;
  background:var(--s2);border:1px solid var(--acc);
  border-radius:var(--r);overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
  z-index:20;max-height:220px;overflow-y:auto;
  display:none;
}
.ac-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 12px;cursor:pointer;
  font-family:var(--mono);font-size:0.78rem;
  border-bottom:1px solid var(--border);transition:background .1s;
}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.focused{background:var(--s3)}
.ac-type{
  font-size:0.6rem;padding:2px 6px;border-radius:4px;
  font-weight:600;white-space:nowrap;flex-shrink:0;
}
.ac-kw{background:rgba(108,99,255,.2);color:var(--acc)}
.ac-fn{background:rgba(0,212,170,.15);color:var(--acc2)}
.ac-cl{background:rgba(255,107,107,.15);color:var(--acc3)}
.ac-hint{color:var(--t2);font-size:0.7rem;margin-left:auto;font-style:italic}
.ac-match{color:var(--acc4)}

/* status bar */
.status-bar{
  display:flex;align-items:center;gap:12px;
  padding:5px 14px;border-top:1px solid var(--border);
  background:var(--s2);font-family:var(--mono);font-size:0.65rem;color:var(--t3);
  flex-shrink:0;
}
.status-ok{color:var(--acc2)}
.status-warn{color:var(--acc4)}

/* ── RIGHT: COMPANION ── */
.companion-pane{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:var(--s1);
}
.companion-header{
  padding:8px 14px;border-bottom:1px solid var(--border);
  background:var(--s2);flex-shrink:0;
  font-family:var(--mono);font-size:0.7rem;color:var(--t2);
  display:flex;align-items:center;gap:8px;
}
.comp-dot{width:6px;height:6px;border-radius:50%;background:var(--acc2);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.companion-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}

/* hint cards */
.hint-card{
  background:var(--s2);border:1px solid var(--border);
  border-radius:var(--r);overflow:hidden;
  animation:slideIn .2s ease;
}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.hint-card.concept{border-left:3px solid var(--acc)}
.hint-card.question{border-left:3px solid var(--acc4)}
.hint-card.warning{border-left:3px solid var(--acc3)}
.hint-card.tip{border-left:3px solid var(--acc2)}
.hint-card.syntax{border-left:3px solid #a78bfa}

.hint-header{
  display:flex;align-items:center;gap:6px;
  padding:7px 10px;border-bottom:1px solid var(--border);
  font-family:var(--mono);font-size:0.62rem;
}
.hint-icon{font-size:0.85rem}
.hint-type-label{color:var(--t2)}
.hint-dismiss{margin-left:auto;cursor:pointer;color:var(--t3);font-size:0.75rem;padding:0 4px;background:transparent;border:none;}
.hint-dismiss:hover{color:var(--acc3)}
.hint-body{padding:9px 11px;font-size:0.82rem;line-height:1.6;color:var(--text)}
.hint-body code{
  font-family:var(--mono);background:var(--s3);
  padding:.1em .4em;border-radius:4px;font-size:.8em;color:var(--acc2);
}
.hint-body strong{color:var(--acc4);font-weight:600}

/* Quiz Style Toggle for Questions */
.quiz-wrapper {
  margin-top: 8px;
  border-top: 1px dashed var(--border);
  padding-top: 8px;
}
.quiz-item {
  margin-bottom: 8px;
  background: var(--s3);
  border-radius: 6px;
  overflow: hidden;
}
.quiz-q {
  padding: 8px 10px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  user-select: none;
}
.quiz-q:hover { background: rgba(255,217,61,0.05); }
.quiz-q::after { content: '👁️ Toon Antwoord'; font-size: 0.65rem; color: var(--acc4); font-family: var(--mono); }
.quiz-item.open .quiz-q::after { content: '🙈 Verberg'; color: var(--t2); }
.quiz-a {
  padding: 10px;
  font-size: 0.78rem;
  background: var(--s2);
  border-top: 1px solid var(--border);
  color: #d4d4f8;
  display: none;
  line-height: 1.5;
}
.quiz-item.open .quiz-a { display: block; }

/* think-aloud prompt */
.think-wrap{
  border-top:1px solid var(--border);padding:10px 14px;
  flex-shrink:0;background:var(--s2);
}
.think-input{
  width:100%;background:var(--s3);border:1px solid var(--border);
  color:var(--text);font-family:var(--mono);font-size:0.78rem;
  padding:8px 12px;border-radius:6px;outline:none;
  transition:border-color .15s;
}
.think-input:focus{border-color:var(--acc)}
.think-input::placeholder{color:var(--t3)}
.think-reply{
  font-family:var(--mono);font-size:0.72rem;color:var(--acc2);
  margin-top:6px;min-height:16px;line-height:1.5;
  display:none;
}

/* welcome */
.welcome{
  text-align:center;padding:2rem 1rem;color:var(--t3);
  font-family:var(--mono);font-size:0.78rem;line-height:1.8;
}
.welcome-big{font-size:1.5rem;margin-bottom:.5rem;display:block}

/* scrollbar */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">DM <em>Study</em></div>
  <div class="mode-pills">
    <button class="pill active" data-mode="sql">SQL</button>
    <button class="pill" data-mode="concept">Concept</button>
    <button class="pill" data-mode="vrij">Vrij schrijven</button>
  </div>
  <span class="kb-hint">Tab = autocomplete &nbsp;·&nbsp; Ctrl+Enter = analyseer</span>
</div>

<div class="workspace">
  <!-- LEFT: editor -->
  <div class="editor-pane">
    <div class="editor-header">
      <span class="editor-label" id="editor-label">SQL Editor</span>
      <select class="topic-select" id="topic-select" onchange="onTopicChange()">
        <option value="">— kies onderwerp —</option>
        <option value="select">SELECT / WHERE / JOIN</option>
        <option value="window">Window Functions</option>
        <option value="groupby">GROUP BY / HAVING / ROLLUP</option>
        <option value="subquery">Subqueries / EXISTS / IN</option>
        <option value="cte">CTE / WITH RECURSIVE</option>
        <option value="ddl">DDL — CREATE / ALTER</option>
        <option value="transaction">Transacties / ACID</option>
        <option value="procedure">Procedures / Triggers</option>
        <option value="isolation">Isolatieniveaus</option>
        <option value="replication">Replicatie / Backup</option>
      </select>
    </div>
    <div class="editor-wrap">
      <textarea class="code-area" id="editor"
        placeholder="Schrijf hier je SQL of gedachten...&#10;&#10;Voorbeelden:&#10;  SELECT ...&#10;  WITH RECURSIVE ...&#10;  CREATE TABLE ...&#10;&#10;De companion denkt met je mee →"
        spellcheck="false"></textarea>
      <div class="autocomplete" id="autocomplete"></div>
    </div>
    <div class="status-bar">
      <span id="status-text">Klaar</span>
      <span style="margin-left:auto" id="char-count">0 tekens</span>
    </div>
  </div>

  <!-- RIGHT: companion -->
  <div class="companion-pane">
    <div class="companion-header">
      <div class="comp-dot"></div>
      <span>Study Companion</span>
    </div>
    <div class="companion-body" id="companion-body">
      <div class="welcome" id="welcome">
        <span class="welcome-big">👆</span>
        Begin te typen in de editor.<br>
        Kies een onderwerp voor gerichte hints.<br>
        <br>
        De companion denkt met je mee —<br>
        stelt vragen, geeft syntaxhints,<br>
        waarschuwt voor valkuilen.
      </div>
    </div>
    <div class="think-wrap">
      <input class="think-input" id="think-input" placeholder="Typ een begrip of vraag... (bv: 'wat is phantom read')" />
      <div class="think-reply" id="think-reply"></div>
    </div>
  </div>
</div>

<script>

═══════════════════════════════════════ */
const SQL_KW = [

/* ═══════════════════════════════════════
   DATA: Concept hints per topic
═══════════════════════════════════════ */
const TOPIC_HINTS = {
  select:[
    {type:'concept',icon:'🔑',t:'Volgorde van clausules',b:'Logische volgorde: <code>SELECT → FROM → JOIN → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT</code>. De <em>uitvoering</em> is omgekeerd: FROM eerst, SELECT pas op het einde.'},
    {type:'warning',icon:'⚠️',t:'NULL-valkuil',b:'<code>WHERE kolom = NULL</code> werkt <strong>niet</strong>. Gebruik altijd <code>IS NULL</code> of <code>IS NOT NULL</code>.'},
    {type:'tip',icon:'💡',t:'JOIN types',b:'LEFT JOIN: alle rijen uit links, ook zonder match. INNER JOIN: enkel matches. CROSS JOIN: elk met elk → N×M rijen.'},
  ],
  window:[
    {type:'syntax',icon:'📐',t:'Window function structuur',b:'<code>FUNCTIE() OVER (PARTITION BY col ORDER BY col ROWS BETWEEN ...)</code><br>PARTITION BY en ORDER BY zijn allebei optioneel.'},
    {type:'warning',icon:'⚠️',t:'GROUP BY vs OVER',b:'Met <code>GROUP BY</code> verdwijnen individuele rijen. Met <code>OVER</code> blijven ze behouden — je krijgt aggregaatwaarde <em>én</em> de rij.'},
    {type:'tip',icon:'💡',t:'Cumulatieve som',b:'<code>SUM(col) OVER (ORDER BY datum)</code> = lopende som. Voeg <code>PARTITION BY city</code> toe om per groep te resetten.'},
  ],
  groupby:[

document.querySelectorAll('.pill').forEach(p => {

/* ═══════════════════════════════════════
   TOPIC change
═══════════════════════════════════════ */
function onTopicChange() {
  currentTopic = document.getElementById('topic-select').value;
  hintsShown.clear();
  clearCompanion();
  
  if (!currentTopic) {
    showWelcome();
    return;
  }

  // 1. Önce konuya özel interaktif soru kartını en üste ekle
  if (TOPIC_QUESTIONS[currentTopic]) {
    addQuestionQuizCard(currentTopic);
  }

  // 2. Ardından statik ipuçlarını (insights) peşinden yükle
  if (TOPIC_HINTS[currentTopic]) {
    showTopicHints(currentTopic);
  }
}

function showTopicHints(topic) {
  const hints = TOPIC_HINTS[topic];
  if (!hints) return;
  hints.forEach((h, i) => {
    setTimeout(() => addHint(h), i * 100);
  });
}

function showWelcome() {
  companionBody.innerHTML = `
    <div class="welcome" id="welcome">
      <span class="welcome-big">👆</span>
      Begin te typen in de editor.<br>
      Kies een onderwerp voor gerichte hints.<br>
      <br>
      De companion denkt met je mee —<br>
      stelt vragen, geeft syntaxhints,<br>
      waarschuwt voor valkuilen.
    </div>
  `;
}

/* ═══════════════════════════════════════
   COMPANION: Add Interactive Question Quiz Card
═══════════════════════════════════════ */
function addQuestionQuizCard(topic) {
  const questions = TOPIC_QUESTIONS[topic];
  if (!questions || !questions.length) return;

  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = 'hint-card question';
  
  let quizHtml = `<div class="quiz-wrapper">`;
  questions.forEach((qObj, index) => {
    quizHtml += `
      <div class="quiz-item" onclick="toggleQuizAnswer(this)">
        <div class="quiz-q">${qObj.q}</div>
        <div class="quiz-a">${qObj.a}</div>
      </div>
    `;
  });
  quizHtml += `</div>`;

  div.innerHTML = `
    <div class="hint-header">
      <span class="hint-icon">🤔</span>
      <span class="hint-type-label">Onderwerp Quiz — Test je kennis</span>
      <button class="hint-dismiss" onclick="this.closest('.hint-card').remove()" title="Sluiten">✕</button>
    </div>
    <div class="hint-body">
      Probeer deze examenvragen op te lossen in de editor! Klik op de vraag voor de oplossing.
      ${quizHtml}
    </div>
  `;
  
  // Her zaman en üste ekle (diğer insight kartları bunun altına eklenecektir)
  companionBody.insertBefore(div, companionBody.firstChild);
}

function toggleQuizAnswer(el) {
  el.classList.toggle('open');
}

/* ═══════════════════════════════════════
   AUTOCOMPLETE
═══════════════════════════════════════ */
editor.addEventListener('keydown', e => {
  if (ac.style.display === 'block') {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(1); return; }
    if (e.key === 'ArrowUp')   { e.preventDefault(); moveFocus(-1); return; }
    if (e.key === 'Tab' || e.key === 'Enter') {
      if (acFocus >= 0) { e.preventDefault(); selectAC(acItems[acFocus]); return; }
    }
    if (e.key === 'Escape') { hideAC(); return; }
  }
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    analyzeQuery();
  }
});

editor.addEventListener('input', () => {
  charCount.textContent = editor.value.length + ' tekens';
  hideAC();
  const text = editor.value;
  const pos = editor.selectionStart;
  const before = text.slice(0, pos);
  const m = before.match(/[\w_]+$/);
  if (!m || m[0].length < 2) return;
  const word = m[0].toUpperCase();
  if (word === lastWord) return;
  lastWord = word;

  const matches = SQL_KW.filter(k => k.w.toUpperCase().startsWith(word) && k.w.toUpperCase() !== word).slice(0, 7);
  if (!matches.length) return;

  acItems = matches;
  acFocus = -1;
  ac.style.display = 'block';
  const lines = before.split('\n');
  const lineNum = lines.length;
  ac.style.top = (lineNum * 21 + 16) + 'px';
  ac.style.left = '16px';
  ac.style.right = '16px';

  ac.innerHTML = matches.map((item, i) => `
    <div class="ac-item" data-i="${i}">
      <span class="ac-type ac-${item.t}">${item.t}</span>
      <span><span class="ac-match">${item.w.slice(0, word.length)}</span>${item.w.slice(word.length)}</span>
      <span class="ac-hint">${item.h}</span>
    </div>
  `).join('');

  ac.querySelectorAll('.ac-item').forEach((el, i) => {
    el.addEventListener('mousedown', e => { e.preventDefault(); selectAC(acItems[i]); });
  });

  if (word === 'NOT' || before.toUpperCase().includes('NOT IN')) {
    triggerContextHint('notin');
  }
});

editor.addEventListener('blur', () => setTimeout(hideAC, 120));

function hideAC() { ac.style.display = 'none'; acFocus = -1; }

function moveFocus(dir) {
  acFocus = Math.max(-1, Math.min(acItems.length - 1, acFocus + dir));
  ac.querySelectorAll('.ac-item').forEach((el, i) => el.classList.toggle('focused', i === acFocus));
}

function selectAC(item) {
  const pos = editor.selectionStart;
  const text = editor.value;
  const before = text.slice(0, pos);
  const after = text.slice(pos);
  const m = before.match(/[\w_]+$/);
  const start = m ? pos - m[0].length : pos;
  editor.value = text.slice(0, start) + item.w + ' ' + after;
  editor.selectionStart = editor.selectionEnd = start + item.w.length + 1;
  editor.focus();
  hideAC();
  statusText.textContent = '✓ ' + item.w;
  setTimeout(() => statusText.textContent = 'Klaar', 2000);
  triggerContextHint(item.w.toLowerCase().replace(/\s+/g,'_'));
}

  'raise_exception': {type:'warning',icon:'⚠️',t:'RAISE EXCEPTION',b:'RAISE EXCEPTION <strong>breekt de transactie</strong>. Gebruik <code>RAISE INFO</code> als de transactie door moet gaan.'},
  'on_delete_cascade': {type:'concept',icon:'🔑',t:'CASCADE',b:'Verwijdert automatisch alle kind-rijen als de parent wordt verwijderd.'},
  'partition_by': {type:'tip',icon:'💡',t:'PARTITION BY',b:'Reset de window-berekening per groep, maar behoudt alle rijen afzonderlijk.'},
  'explain_analyze': {type:'tip',icon:'💡',t:'EXPLAIN ANALYZE',b:'Kijk naar: <em>Seq Scan</em> (volledig) of <em>Index Scan</em> (selectief) en vergelijk estimated vs actual rows.'},
  'having': {type:'concept',icon:'🔑',t:'HAVING vs WHERE',b:'WHERE filtert rijen vóór aggregatie. HAVING filtert groepen ná aggregatie.'},
  'rollup': {type:'tip',icon:'💡',t:'ROLLUP',b:'<code>GROUP BY ROLLUP(a, b)</code> genereert subtotalen per combinaties van (a,b), (a) en het algemene totaal.'},
};

function triggerContextHint(kw) {
  const key = kw.replace(/\s+/g,'_');
  if (hintsShown.has(key)) return;
  const hint = KEYWORD_HINTS[key];
  if (!hint) return;
  hintsShown.add(key);
  addHint(hint);
}

/* ═══════════════════════════════════════
   ANALYZE (Ctrl+Enter)
═══════════════════════════════════════ */
function analyzeQuery() {
  const text = editor.value.trim().toUpperCase();
  if (!text) return;

  if (text.includes('NOT IN') && !text.includes('NOT EXISTS')) {
    addHint({type:'warning',icon:'⚠️',t:'Opgepast: NOT IN gedetecteerd',b:'Controleer of de subquery NULLs kan bevatten. Zo ja, gebruik <code>NOT EXISTS</code> als veiliger alternatief.'});
  }
  if (text.includes('GROUP BY') && text.includes('OVER (')) {
    addHint({type:'tip',icon:'💡',t:'GROUP BY + Window',b:'Je combineert GROUP BY en window functions. Zorg dat de window-kolommen ook in GROUP BY staan of geaggregeerd zijn.'});
  }
  if (text.includes('CROSS JOIN')) {
    addHint({type:'question',icon:'🤔',t:'CROSS JOIN check',b:'Je gebruikt CROSS JOIN. Is dit de bedoeling? Controleer het aantal verwachte rijen (N×M).'});
  }
  if ((text.includes('WITH RECURSIVE') || text.includes('RECURSIVE')) && !text.includes('UNION ALL')) {
    addHint({type:'warning',icon:'⚠️',t:'Recursieve CTE',b:'Een recursieve CTE heeft <code>UNION ALL</code> nodig tussen het basisgeval en de recursieve stap!'});
  }
  if (!text.includes('NOT IN') && !text.includes('NOT EXISTS') && !text.includes('CROSS JOIN') && !text.includes('RECURSIVE')) {
    addHint({type:'tip',icon:'💡',t:'Query geanalyseerd',b:'Geen directe logische valkuilen gevonden in de syntax. Controleer of de tabel- en kolomnamen kloppen.'});
  }
  statusText.innerHTML = '<span class="status-ok">Analyse klaar</span>';
  setTimeout(() => statusText.textContent = 'Klaar', 3000);
}

/* ═══════════════════════════════════════
   COMPANION: Add insight hint card
═══════════════════════════════════════ */
function addHint(h) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = `hint-card ${h.type}`;
  div.innerHTML = `
    <div class="hint-header">
      <span class="hint-icon">${h.icon}</span>
      <span class="hint-type-label">${h.type} — ${h.t}</span>
      <button class="hint-dismiss" onclick="this.closest('.hint-card').remove()" title="Sluiten">✕</button>
    </div>
    <div class="hint-body">${h.b}</div>
  `;
  
  // Eğer içeride bir soru/quiz kartı varsa, yeni insight kartlarını onun hemen ALTINA ekle (soru üstte sabit kalsın)
  const firstQuestionCard = companionBody.querySelector('.hint-card.question');
  if (firstQuestionCard && h.type !== 'question') {
    firstQuestionCard.after(div);
  } else {
    companionBody.insertBefore(div, companionBody.firstChild);
  }

  // En fazla 8 kart tut (Scroll taşmasını önlemek için)
  const cards = companionBody.querySelectorAll('.hint-card');
  if (cards.length > 8) cards[cards.length - 1].remove();
}

function clearCompanion() {
  companionBody.innerHTML = '';
}

/* ═══════════════════════════════════════
   THINK-ALOUD input
═══════════════════════════════════════ */
thinkInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = thinkInput.value.trim().toLowerCase();
    if (!val) return;
    const match = QA.find(q => q.k.some(k => val.includes(k)));
    thinkReply.style.display = 'block';
    if (match) {
      thinkReply.innerHTML = match.r;
    } else {
      thinkReply.innerHTML = `Geen directe hint voor "<em>${thinkInput.value.trim()}</em>". Probeer: acid, phantom, savepoint, rank, not in, cascade, rollup…`;
    }
    thinkInput.value = '';
    setTimeout(() => { thinkReply.style.display = 'none'; }, 8000);
  }
});

/* ═══════════════════════════════════════
   EDITOR: Live Context Scanner
═══════════════════════════════════════ */
let debounceTimer;
editor.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const text = editor.value.toUpperCase();
    const checks = [
      {pattern:'NOT IN', key:'not_in'},
      {pattern:'CROSS JOIN', key:'cross_join'},
      {pattern:'WITH RECURSIVE', key:'with_recursive'},
      {pattern:'ROLLBACK TO SAVEPOINT', key:'rollback_to_savepoint'},
      {pattern:'RANK()', key:'rank'},
      {pattern:'DENSE_RANK()', key:'dense_rank'},
      {pattern:'RAISE EXCEPTION', key:'raise_exception'},
      {pattern:'ON DELETE CASCADE', key:'on_delete_cascade'},
      {pattern:'PARTITION BY', key:'partition_by'},
      {pattern:'HAVING', key:'having'},
      {pattern:'ROLLUP', key:'rollup'},
    ];
    checks.forEach(c => {
      if (text.includes(c.pattern)) triggerContextHint(c.key);
    });
  }, 600);
});
</script>
